<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ダークな背景（セラーの暗がり） -->
  <rect width="512" height="512" fill="#2a2a2a" rx="112" />
  
  <!-- 蔵（Kura）のシルエット -->
  <path d="M 80,240 L 256,90 L 432,240 L 432,430 L 80,430 Z" fill="#d4c4b7" />
  <path d="M 50,240 L 256,60 L 462,240 L 432,260 L 256,110 L 80,260 Z" fill="#eaddcf" />
  
  <!-- ワインボトル（蔵の扉に見立てた形） -->
  <path d="M 236,180 L 276,180 L 276,230 L 316,290 L 316,430 L 196,430 L 196,290 L 236,230 Z" fill="#2a2a2a" />
  
  <!-- 糊（Glue）の滴 / ワインの滴 -->
  <path d="M 256,230 C 276,260 276,290 256,290 C 236,290 236,260 256,230 Z" fill="#eaddcf" />
  
  <!-- ボトルのハイライト -->
  <rect x="248" y="180" width="16" height="10" fill="#d4c4b7" />
</svg>
